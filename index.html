<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/src/assets/icon_escuro.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Mirante Radar</title>
  <meta name="description" content="Inteligência de audiência em tempo real" />
  <meta name="application-name" content="Mirante Radar" />
  <meta name="author" content="Mirante IA" />
  <meta name="robots" content="noindex, nofollow" />

  <!-- Theme color -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F0F4FF" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#090E1A" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Mirante Radar" />
  <meta property="og:description" content="Inteligência de audiência em tempo real" />
  <meta property="og:site_name" content="Mirante Radar" />

  <!-- Prevent flash of unstyled content for dark mode -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme')
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) { }
    })()
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
